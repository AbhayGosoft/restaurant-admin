name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Create CI Environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=mysql://ci:ci@localhost:3306/ci
          PORT=4000
          NODE_ENV=test
          JWT_SECRET=ci-jwt-secret
          JWT_EXPIRES_IN=7d
          FRONTEND_ORIGIN=http://localhost:3000
          REDIS_URL=redis://127.0.0.1:6379
          LOG_LEVEL=silent
          APP_CLIENT_KEY=ci-client-key
          SAAS_ADAPTER_API_KEY=ci-adapter-key
          SAAS_ADAPTER_HMAC_SECRET=ci-hmac-secret
          EOF

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Build Backend
        run: npm run build

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_NAME="connector"
            REPO_PATH="${{ secrets.PROJECT_PATH }}"
            BACKEND_PATH="$REPO_PATH/backend"
            RELEASE_SHA="${{ github.sha }}"

            echo "========== Backend Deploy =========="

            cd "$REPO_PATH"

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard "$RELEASE_SHA"

            cd "$BACKEND_PATH"

            if [ ! -f ".env" ]; then
              echo "ERROR: backend/.env not found."
              exit 1
            fi

            chmod 600 .env

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma client..."
            npm run prisma:generate

            echo "Validating Prisma schema..."
            npx prisma validate

            echo "Applying migrations..."
            npx prisma migrate deploy

            echo "Building backend..."
            npm run build

            echo "Restarting PM2..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start dist/src/server.js \
                --name "$APP_NAME" \
                --cwd "$BACKEND_PATH"
            fi

            pm2 save

            echo "Waiting for application..."

            for i in {1..12}; do
              if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
                echo "✅ Health check passed."
                echo "========== Deploy Completed =========="
                exit 0
              fi

              echo "Application not ready yet... retry $i/12"
              sleep 5
            done

            echo "❌ Health check failed"

            pm2 status "$APP_NAME"
            pm2 logs "$APP_NAME" --lines 50 --nostream

            exit 1