name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

concurrency:
  group: frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Debug Environment
        run: |
          cat .env.production

      - name: Write Production Secrets
        run: echo "VITE_CLIENT_KEY=${{ secrets.VITE_CLIENT_KEY }}" >> .env.production

      - name: Build Frontend
        run: npm run build

      - name: Check Build
        run: |
          grep -R "connector.bharatotel.com" dist || true
          grep -R "appconnector.bharatotel.com" dist || true

      - name: Check Build URLs
        run: |
          strings dist/assets/*.js | grep "bharatotel.com"

      - name: Upload Build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          source: "frontend/dist/*"
          target: "${{ secrets.PROJECT_PATH }}/frontend/dist"

          strip_components: 2
          overwrite: true

      - name: Deployment Complete
        run: echo "Frontend deployed successfully."