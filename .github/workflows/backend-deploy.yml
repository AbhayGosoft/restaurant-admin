name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Tests
        run: npm test

      - name: Build Backend
        run: npm run build


  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            APP_NAME="restaurant-backend"
            REPO_PATH="/var/www/restaurant-admin"
            BACKEND_PATH="$REPO_PATH/backend"
            RELEASE_SHA="${{ github.sha }}"

            echo "======================================"
            echo " Restaurant Backend Deploy"
            echo "======================================"

            cd "$REPO_PATH"

            echo "Fetching latest code..."

            git fetch origin main

            echo "Checking out release: $RELEASE_SHA"

            git reset --hard "$RELEASE_SHA"

            cd "$BACKEND_PATH"

            echo "Checking production environment..."

            if [ ! -f ".env.production" ]; then
              echo "❌ ERROR: backend/.env.production not found."
              exit 1
            fi

            echo "Creating .env from .env.production..."

            cp .env.production .env

            chmod 600 .env

            echo "Installing dependencies..."

            npm ci

            echo "Generating Prisma client..."

            npm run prisma:generate

            echo "Validating Prisma schema..."

            npx prisma validate

            echo "Applying database migrations..."

            npx prisma migrate deploy

            echo "Building backend..."

            npm run build

            echo "Restarting PM2..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start dist/src/server.js \
                --name "$APP_NAME" \
                --cwd "$BACKEND_PATH"
            fi

            echo "Saving PM2 process list..."

            pm2 save

            echo "======================================"
            echo " Waiting for application..."
            echo "======================================"

            for i in {1..12}; do

              if curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:4000/api/health \
                >/dev/null; then

                echo "✅ Health check passed."

                echo "======================================"
                echo " Deployment Completed Successfully"
                echo "======================================"

                exit 0
              fi

              echo "Application not ready yet..."
              echo "Retry $i/12"

              sleep 5
            done

            echo "======================================"
            echo "❌ Health check failed"
            echo "======================================"

            echo "PM2 status:"

            pm2 status "$APP_NAME"

            echo "Recent application logs:"

            pm2 logs "$APP_NAME" \
              --lines 50 \
              --nostream

            exit 1
